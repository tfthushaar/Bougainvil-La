name: Deploy main site

# Rebuilds and redeploys the public Cloudflare Worker whenever code changes
# land on main (replaces the previous manual `npm run cf:deploy` habit).
#
# Content edits from admin do NOT need this: the deployed Worker has no
# incremental cache backend configured, so lib/content/*.ts's database
# queries actually run fresh on every request — content saved in admin is
# already live on the public site instantly, no rebuild required.
on:
  push:
    branches: [main]
    # Admin-only or docs-only commits don't need a public-site rebuild.
    paths-ignore: ['admin/**', '**/*.md']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run cf:deploy
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
