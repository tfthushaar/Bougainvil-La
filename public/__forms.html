<html>
  <head></head>
  <body>
    <!--
      Netlify's build-time form scanner reads this static file to register
      the "enquiry" form (name/fields must match components/sections/
      EnquireForm.tsx and app/(site)/contact/page.tsx exactly). Now that the
      site is server-rendered, Netlify can no longer detect forms straight
      from the prerendered page HTML -- see lib/useNetlifyForm.ts for the
      client-side submit that POSTs here.
      https://opennext.js.org/netlify/forms
    -->
    <form name="enquiry" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="wedding_date" type="date" />
      <input name="guest_count" type="number" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
