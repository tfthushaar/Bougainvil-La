[build]
  command = "npm run build"
  # Server-rendered Next.js build (needed for Sanity's Presentation tool /
  # draft mode) — the Next.js Runtime plugin reads from `.next`, not the old
  # static-export `out/` dir. Set explicitly here (publishOrigin: config) so
  # it overrides the site's dashboard-level "Publish directory" setting,
  # which was left over from when this was a static export and doesn't
  # update itself just because this file changed.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Public Sanity project identifiers — safe to commit (not secrets, just
  # config). Only needed so the build can read published content; no write
  # token is required here since builds never write to Sanity.
  NEXT_PUBLIC_SANITY_PROJECT_ID = "wn66u1a8"
  NEXT_PUBLIC_SANITY_DATASET = "production"
  NEXT_PUBLIC_SANITY_API_VERSION = "2025-01-01"
  NEXT_PUBLIC_SITE_URL = "https://bougainvilla.co.in"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
